# Versi API Kubernetes untuk objek Secret
apiVersion: v1
# Jenis objek Kubernetes (Secret untuk menyimpan data sensitif)
kind: Secret
# Metadata Secret
metadata:
  name: mongo-secret  # Nama secret yang akan direferensikan oleh Deployment
type: Opaque  # Tipe default untuk secret key-value biasa
data:
  # Data disimpan dalam format base64 encoded (bukan enkripsi!)
  MONGO_ROOT_USERNAME: YWRtaW4=  # 'admin' dalam base64 (echo -n 'admin' | base64)
  MONGO_ROOT_PASSWORD: c3VwZXJzZWNyZXRwYXNzd29yZA==  # 'supersecretpassword' dalam base64